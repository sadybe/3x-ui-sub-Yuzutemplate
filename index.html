<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانلود برنامه‌ها</title>
  <style>
    body {
      background-color: #0f1017;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 900px;
      padding: 20px;
    }

    /* کل کارت یک لینک است */
    .app-card {
      background-color: #1a1c29;
      border: 1px solid #2a2d3d;
      border-radius: 16px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none; /* حذف خط زیر لینک */
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    /* افکت هوور هنگام رفتن ماوس روی کل کارت */
    .app-card:hover {
      background-color: #222536;
      border-color: #6366f1;
      transform: translateY(-4px);
    }

    .app-icon {
      width: 28px;
      height: 28px;
      color: #818cf8;
      margin-bottom: 16px;
    }

    .app-title {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 6px 0;
    }

    .app-platform {
      color: #6b7280;
      font-size: 0.9rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="cards-container">
    
    <!-- کارت ۱ -->
    <a href="https://example.com/hiddify.apk" class="app-card" target="_blank">
      <svg class="app-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
      </svg>
      <h3 class="app-title">Hiddify</h3>
      <p class="app-platform">Android</p>
    </a>

    <!-- کارت ۲ -->
    <a href="https://example.com/v2rayng.apk" class="app-card" target="_blank">
      <svg class="app-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
      </svg>
      <h3 class="app-title">v2rayNG</h3>
      <p class="app-platform">Android</p>
    </a>

    <!-- کارت ۳ -->
    <a href="https://example.com/v2box.ipa" class="app-card" target="_blank">
      <svg class="app-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
      </svg>
      <h3 class="app-title">V2Box</h3>
      <p class="app-platform">iOS</p>
    </a>

    <!-- کارت ۴ -->
    <a href="https://example.com/happ.ipa" class="app-card" target="_blank">
      <svg class="app-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
      </svg>
      <h3 class="app-title">Happ</h3>
      <p class="app-platform">iOS</p>
    </a>

  </div>

</body>
</html>
